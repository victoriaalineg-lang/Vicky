<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Intento 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="superior">
        <div class="div-titulo">
            <h1>
                Libroteca
            </h1>
        </div>

        <div class="div-button">
            <button type="button" id="boton-iniciar-sesion">Inicio de Sesión</button>
            <button type="button" id="button">Registro</button>
        </div>
    </div>

    <div class="menu">
        <div class="elige">
            <h2>Elige tu libro</h2>
        </div>

        <div class="revisa">
            <h2>Revisa disponibilidad</h2>
        </div>

        <div class="separa">
            <h2>Separalo</h2>
        </div>

        <div class="recibelo">
            <h2>Recíbelo</h2>
        </div>

    </div>

    <div class="generos">
        <div class="titulo-genero">
            <button type="button" id="buton-genero-1">Ficción</button>
        </div>

        <div class="titulo-genero">
            <button type="button" id="buton-genero-2">Históricos</button>
        </div>

        <div class="titulo-genero">
            <button type="button" id="buton-genero-3">Tecnología</button>
        </div>

        <div class="titulo-genero">
            <button type="button" id="buton-genero-4">Autoayuda</button>
        </div>

        <div class="titulo-genero">
            <button type="button" id="buton-genero-5">Poesía</button>
        </div>
    </div>

    <div class="div-libros">
        <h2>
            Todos los libros
        </h2>
    </div>

    <div class="items">
        <div class="items-1">
            <img src="icon/book.jpg" id="img" alt="img">
            <p class="parrafo-1">
                Cien Años de Soledad
            </p>
            <p class="parrafo-2">
                Gabriel García Márquez
            </p>
            <button type="button" id="button-rentar-1">Rentar</button>
        </div>

        <div class="items-1">
            <img src="icon/book.jpg" id="img" alt="img">
            <p class="parrafo-1">
                Rayuela
            </p>
            <p class="parrafo-2">
                Julio Cortázar
            </p>
            <button type="button" id="button-rentar-2">Rentar</button>
        </div>

        <div class="items-1">
            <img src="icon/book.jpg" id="img" alt="img">
            <p class="parrafo-1">
                Travesuras de la Niña Mala
            </p>
            <p class="parrafo-2">
                Mario Vargas Llosa
            </p>
            <button type="button" id="button-rentar-3">Rentar</button>
        </div>
    </div>

    <div class="footer">
        <h3>
            Todos los derechso reservados por mi, ATT: Vicky. Libroteca
        </h3>
    </div>

    <script src="script.js"></script>
</body>

</html>
