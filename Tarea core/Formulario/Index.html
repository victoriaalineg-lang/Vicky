<html> 

    <head> 
    <title> Formulario</title>
    </head>

    <body> 

        <h1> ¡Regístrate y únete a la comunidad! </h1>
        
        <div> 
            <label for="Nombre"> Nombre:</label>
            <input name="id_nombre" type="text"> </input> 
        </div>

        <br>

        <div> 
            <label for="Apellido"> Apellido:</label>
            <input name="id_Apellido" type="text"> </input> 
        </div>

        <br>

        <div>
            <label for="Correo Electronico"> Correo Electronico:</label>
            <input name="id_correo_electronico" type="email"> </input>

        </div>

        <br>

        <div>
            <label for="Contraseña"> Contraseña:</label>
            <input name="id_contraseña" type="password" > </input>

        </div>

        <br>

        <div> 
            <label for="Confirmar contraseña"> Confirmar Contraseña:</label>
            <input name="id_confirmar_contraseña" type="password"> </input>

        </div>

        <br>

        <div>
            <label for="Fecha de Nacimiento"> Fecha de Nacimiento:</label>
            <input name="id_fecha_de_nacimiento" type="date"> </input>

        </div>

        <br>

        <div> 
        <label> Genero:</label>
        <input name="genero" type="radio">Masculino</input>
        <input name="genero"  type="radio">Femenino</input>
        <input name="genero" type="radio">Prefiero no decir</input> 

        </div>

        <br>

        <div> 
            <input type="checkbox" name="Suscripción"></input>
            <label for="Suscripción"> Suscríbete a nuestro boletín de noticias</label>
    
        </div>

        <br>

        <div> 
            <label for="Descripcion"> Una descripción de mi mismo</label>
            <br>
            <textarea rows="4"> </textarea>
        </div>

        <br>

        <div>
            <label for="Seleccionar"> Selecciona tus intereres:</label>
            
            <br>

            <select id="opciones" name="opciones" multiple size="4" >
                <option value="Musica">Música</option>
                <option value="Deportes">Deportes</option>
                <option value="Viajes">Viajes</option>
                <option value="Tecnologia"> Tecnología</option>
            </select>

        </div>

        <br> 

        <div>
            <input value="¡Registrarse!" name="id_Registro" type="submit">  </input> 
        </div>





    </body>
</html>
